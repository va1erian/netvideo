# netvideo-server behind Cosmos Cloud.
#
# Cosmos Cloud terminates TLS and routes https://video.homelab.net to the
# internal port 8080; netvideo-server runs plain HTTP inside the bridge network.
#
# First pairing (admin device): scan the QR code with the Android app, or
# type the address and the printed code.
#   docker exec -it netvideo-server netvideo-server pair --qr
# Viewer devices: add --viewer.

services:
  netvideo-server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    container_name: netvideo-server
    restart: unless-stopped
    # Cosmos reaches the container over the Docker network. Do not publish
    # 8080 on the host: that would expose plain HTTP beside the TLS proxy.
    expose:
      - "8080"
    environment:
      - RUST_LOG=info,netvideo_server=debug
      - NETVIDEO_LIBRARY_PATHS=/media/videos
      # The address clients use, put in pairing QR codes (`pair --qr`).
      - NETVIDEO_PUBLIC_URL=https://video.homelab.net
      # Docker bridges cannot reach each other, so this only trusts peers on
      # netvideo's own network. Narrow it to that network's subnet if other
      # containers share it.
      - NETVIDEO_TRUSTED_PROXIES=172.16.0.0/12,127.0.0.1
    volumes:
      # Videos are mounted read-only: the server never writes to the library.
      - /path/to/videos:/media/videos:ro
      # A named volume is pre-owned by the image's uid 10001. For a bind mount
      # instead, first `mkdir -p /path/to/data && chown 10001:10001 /path/to/data`.
      - netvideo-data:/var/lib/netvideo
    read_only: true
    # Bounds a hostile video that drives ffprobe into runaway allocation: the
    # container is OOM-killed and restarted instead of starving the host.
    mem_limit: 2g
    # Headroom for the 32 concurrent streams the server allows (a file and a
    # socket each) plus SQLite and probes; Docker's default soft limit is 1024.
    ulimits:
      nofile: { soft: 8192, hard: 8192 }
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "cosmos-cloud.enabled=true"
      - "cosmos-cloud.domain=video.homelab.net"
      - "cosmos-cloud.target-port=8080"

volumes:
  netvideo-data:
