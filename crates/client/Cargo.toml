[package]
name = "netvideo-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Cross-platform client for netvideo-server: pairing, tokens and browsing"

[lib]
name = "netvideo_client"
path = "src/lib.rs"

[dependencies]
dirs = "5"
hex = "0.4"
http = "1"
pasetors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
netvideo-server = { path = "../server" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
